<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1600px"/>
    <title>김영평생교육원</title>
    <link rel="stylesheet" href="../../assets/css/common.css?v=1.0">
    <link rel="stylesheet" href="../../assets/css/main.css?v=1.0">
    <link rel="stylesheet" href="../../assets/css/sub.css?v=1.0">
    <link rel="stylesheet" href="../../assets/css/swiper-bundle.min.css">
    <link rel="preload" href="/assets/font/PretendardVariable.woff2" as="font" type="font/woff2" crossorigin="anonymous">

    <script src="../../assets/js/jquery-3.7.1.min.js"></script>
    <script src="../../assets/js/swiper-bundle.min.js"></script>
    <script src="../../assets/js/script.js"></script>
    <script src="../../assets/js/swiper.js"></script>
</head>
<body>

    <main class="exam">

        <!-- 시험 헤더 -->
        <header class="exam_header">

            <div class="exam_header_title">
                <span class="exam_type">중간고사</span>
                <h1>국제경영</h1>
            </div>

            <div class="exam_timer">
                <span class="material-symbols-rounded">timer</span>
                <strong>29:43</strong>
            </div>

        </header>


        <div class="exam_container">

            <!-- 문제 영역 -->
            <section class="exam_question">

                <div class="question_head">
                    <span class="question_number">01</span>
                    <span class="question_type">객관식</span>
                </div>

                <div class="question_body">

                    <p class="question">
                        다음 중 국제경영에 대한 설명으로
                        가장 적절한 것은?
                    </p>

                    <div class="answer_list">

                        <label>
                            <input type="radio" name="question01">
                            <span class="answer_number">①</span>
                            <span class="answer_text">
                                국내 시장에서만 활동하는 기업의 경영활동
                            </span>
                        </label>

                        <label>
                            <input type="radio" name="question01">
                            <span class="answer_number">②</span>
                            <span class="answer_text">
                                국가 간 경계를 넘어 이루어지는 경영활동
                            </span>
                        </label>

                        <label>
                            <input type="radio" name="question01">
                            <span class="answer_number">③</span>
                            <span class="answer_text">
                                정부기관의 행정활동
                            </span>
                        </label>

                        <label>
                            <input type="radio" name="question01">
                            <span class="answer_number">④</span>
                            <span class="answer_text">
                                개인의 소비활동
                            </span>
                        </label>

                    </div>

                </div>

            </section>


            <!-- 문제 네비게이션 -->
            <aside class="exam_navigation">

                <div class="navigation_head">
                    <strong>문제 목록</strong>
                    <span>1 / 25</span>
                </div>

                <div class="question_numbers">

                    <button type="button" class="active">01</button>
                    <button type="button">02</button>
                    <button type="button" class="answered">03</button>
                    <button type="button">04</button>
                    <button type="button">05</button>
                    <button type="button">06</button>
                    <button type="button">07</button>
                    <button type="button">08</button>
                    <button type="button">09</button>
                    <button type="button">10</button>

                </div>

                <div class="navigation_legend">
                    <span>
                        <i class="answered"></i>
                        답변완료
                    </span>

                    <span>
                        <i></i>
                        미응답
                    </span>
                </div>

            </aside>

        </div>


        <!-- 하단 버튼 -->
        <div class="exam_footer">

            <button type="button" class="btn secondary">
                이전 문제
            </button>

            <button type="button" class="btn primary">
                다음 문제
            </button>

        </div>

    </main>

</body>
</html>
