   <div class="login_wrapper">
        <header>

                <a href="#none"><img src="../assets/images/common/Logo.svg" alt="김영평생교육원"></a>

        <div class="login_box">

                        <h4><label for="loginId">아이디</label></h4>
                    </header>
                    <input id="loginId" name="loginId" type="text" placeholder="아이디를 입력해 주세요." autocomplete="username">
                    <button class="btn_delete" type="button" aria-label="아이디 입력값 삭제">
                        <span class="material-symbols-rounded">close</span>
                    </button>
                </div>

                <div class="input_area">
                    <header>
                        <h4><label for="loginPassword">비밀번호</label></h4>
                    </header>
                    <input id="loginPassword" name="loginPassword" type="password" placeholder="비밀번호를 입력해 주세요.">
                    <button class="btn_delete" type="button" aria-label="비밀번호 입력값 삭제">
                        <span class="material-symbols-rounded">close</span>
                    </button>
                </div>

                    <input id="saveId" name="saveId" type="checkbox"> 아이디 저장
                </label>
                <p class="error_message" hidden>비밀번호를 5회 연속 잘못 입력하셨습니다.<br />
로그인이 제한되었으며, 잠금 해제 후 이용 가능합니다.</p>

                <ul class="btn_login">
                    <li><button type="button" class="btn">비밀번호 잠금 해제</button></li>
                    <li><button type="submit">로그인</button></li>
                    <li><button type="button" disabled>로그인</button></li>

                <ul class="btn_find">
