<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>김영평생교육원</title>
    <link rel="stylesheet" href="../assets/css/common.css?v=1.0">
    <link rel="stylesheet" href="../assets/css/sub.css?v=1.0">
    <link rel="preload" href="../assets/font/PretendardVariable.woff2" as="font" type="font/woff2" crossorigin="anonymous">

    <script src="../assets/js/jquery-3.7.1.min.js"></script>
    <script src="../assets/js/script.js"></script>
</head>
<body>
   <div class="login_wrapper">
        <header>
            <h1>
                <a href="#none"><img src="../assets/images/common/Logo.svg" alt="김영평생교육원"></a>
            </h1>
            <h2>비밀번호 재설정</h2>
        </header>
        <div class="login_box">
            <form class="login_input" action="#none" method="post" novalidate>
                <div class="input_area">
                    <header>
                        <h4><label for="loginId">새 비밀번호</label></h4>
                        <p>8~20자 이내의 영문, 숫자, 특수문자 조합 (단, ‘ ; - 	&lt; ( ) / \ 사용 불가)</p>
                    </header>
                    <input id="loginId" name="loginId" type="password" placeholder="새 비밀번호를 입력해 주세요." autocomplete="new-password" class="error">
                    <button class="btn_delete" type="button" aria-label="비밀번호 입력값 삭제">
                        <span class="material-symbols-rounded">close</span>
                    </button>
                </div>
                <p class="error_message">사용 불가능한 비밀번호 입니다.</p>

                <div class="input_area">
                    <header>
                        <h4><label for="loginIdConfirm">새 비밀번호 확인</label></h4>
                    </header>
                    <input id="loginIdConfirm" name="loginIdConfirm" type="password" placeholder="새 비밀번호를 한번 더 입력해 주세요." autocomplete="new-password">
                    <button class="btn_delete" type="button" aria-label="비밀번호 입력값 삭제">
                        <span class="material-symbols-rounded">close</span>
                    </button>
                </div>
                <p class="error_message" hidden>비밀번호가 일치하지 않습니다. 다시 입력해 주세요.</p>

                
                <ul class="btn_login">
                    <li><button type="button" disabled>확인</button></li>
                    <li><button type="button">확인</button></li>
                </ul>

                <ul class="btn_find">
                    <li><a href="id_search.html">아이디 / 비밀번호 찾기</a></li>
                    <li><a href="step_01.html">회원가입</a></li>
                </ul>
            </form>
        </div>
        <!-- footer -->
        <footer class="login_footer">
            <ul>
                <li><a href="#none">이용약관</a></li>
                <li><a href="#none">개인정보처리방침</a></li>
            </ul>
           <p>copyright ⓒ 2026 김영평생교육원 All right reserved.</p>
        </footer>
        <!-- //footer -->
    </div>
    
</body>
</html>
