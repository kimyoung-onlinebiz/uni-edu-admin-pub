<body>
   <div class="login_wrapper">
        <header>
            <h1>
                <a href="#none"><img src="../assets/images/common/Logo.svg" alt="김영평생교육원"></a>
            </h1>
            <h2>비밀번호 잠금 해제</h2>
        </header>
        <div class="login_box">
            <ul class="tab">
                <li><a href="#none" class="active" aria-current="page">SMS 인증</a></li>
                <li><a href="#none">이메일 인증</a></li>
            </ul>
            <form class="login_input" action="#none" method="post" novalidate>

                <div class="input_area">
                    <header>
                        <h4><label for="userId">아이디</label></h4>
                    </header>
                    <input id="userId" name="userId" type="text" placeholder="아이디를 입력해주세요." autocomplete="username" class="error">
                    <button class="btn_delete" type="button" aria-label="아이디 입력값 삭제">
                        <span class="material-symbols-rounded">close</span>
                    </button>
                </div>

                 <p class="error_message">등록된 회원정보가 없습니다. 아이디가 없는 경우, 회원가입을 진행하시거나 탈퇴 회원인 경우 재가입 또는 고객센터로 문의해 주세요.</p>

                <ul class="btn_login">
                    <li><button type="submit" disabled>인증하기</button></li>
                    <li><button type="submit">인증하기</button></li>
                </ul>

                <ul class="btn_find">
                    <li><a href="login.html">로그인</a></li>
                    <li><a href="step_01.html">회원가입</a></li>
                </ul>
            </form>
        </div>
        <!-- footer -->
        <footer class="login_footer">
            <ul>
